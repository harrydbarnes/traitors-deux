<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Points Page</title>
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        .vial-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .vial {
            width: 50px;
            height: 200px;
            border: 2px solid white;
            position: relative;
            margin: 0 20px;
            overflow: hidden;
        }

        .vial-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: gold;
        }

        .vial-label {
            position: absolute;
            top: -30px;
            width: 100%;
            text-align: center;
        }

        .remaining {
            font-size: 20px;
            margin-top: 20px;
        }

        @media screen and (max-width: 768px) {
            .remaining {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="vial-container">
            <div class="vial">
                <div class="vial-fill" id="faithfuls-fill"></div>
                <div class="vial-label">Faithfuls</div>
            </div>
            <div class="vial">
                <div class="vial-fill" id="traitors-fill"></div>
                <div class="vial-label">Traitors</div>
            </div>
        </div>
        <div class="remaining" id="remaining-points"></div>
    </div>

    <script src="js/menu.js"></script>
    <!-- Note: no audio.js here in original, but consistent look might benefit from it if needed. Original didn't have audio here. -->

    <script>
        const faithfulsPoints = 35;
        const traitorsPoints = 11;
        const maxPoints = 72;

        const faithfulsFill = document.getElementById('faithfuls-fill');
        const traitorsFill = document.getElementById('traitors-fill');
        const remainingPointsDisplay = document.getElementById('remaining-points');

        function updateVials() {
            faithfulsFill.style.height = `${(faithfulsPoints / maxPoints) * 100}%`;
            traitorsFill.style.height = `${(traitorsPoints / maxPoints) * 100}%`;
            remainingPointsDisplay.textContent = `Remaining: ${maxPoints - faithfulsPoints - traitorsPoints}`;
        }

        updateVials();
    </script>
</body>
</html>
